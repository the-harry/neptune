# NEPTUNE — flake8's configuration, and nothing else.
#
# WHY THIS FILE EXISTS AT ALL when everything else is in pyproject.toml: flake8 does not
# read pyproject.toml and has said for years that it will not. setup.cfg, tox.ini and
# .flake8 are the three files it does read, and of those setup.cfg is the one an editor
# plugin finds without being told. One tool's limitation, one file, said out loud here so
# nobody spends an afternoon wondering why the [tool.flake8] table they added is ignored.
#
# THIS DOES NOT MAKE THE REPO A PACKAGE. There is no [metadata] and no [options] section;
# nothing here is `pip install`-able and setuptools is never invoked.
#
# Run it, with the other three, through the one entry point:  python lint.py

[flake8]
# The same 120 as black's line-length in pyproject.toml. If one of these two numbers is
# ever changed, the other one is now a bug: black wraps to its width and flake8 complains
# about the result, forever, and the person in the middle learns to ignore E501.
max-line-length = 120

# WHAT IS SWITCHED OFF, AND WHY EACH ONE IS OFF.
#
# extend-ignore ADDS to flake8's own default ignore list rather than replacing it, which
# matters: the defaults already include E704 (statement on the same line as a def) and
# W503/W504 (line break before/after a binary operator), and all three are things black
# does on purpose. Using `ignore =` here would switch those defaults back ON and start
# the formatter/linter fight this file exists to prevent.
#
#   E203  whitespace before ':'. black writes `frame[lower + off : upper + off]` — a
#         deliberate, documented choice that puts spaces around a slice colon when the
#         operands are expressions, and pycodestyle has never agreed with it. This is the
#         one genuine disagreement between the two tools, and black's side wins because
#         black is the one that writes the file.
#
# NOTHING ELSE IS IGNORED, ON PURPOSE. In particular E501 (line too long) stays ON: 120
# is a real limit here, not a suggestion, and the alternative — switching E501 off and
# leaning on black — misses the lines black cannot split, which are exactly the long
# comment sentences this codebase is full of. And E7xx (`if x: return`, `a = 1; b = 2`)
# stays on because black rewrites those into two lines anyway; ignoring them would hide
# the fact that a file has not been through the formatter yet.
extend-ignore = E203

# Not this project's source: virtualenvs on either machine, python's and mypy's caches,
# and the runtime data the Pi writes.
#
# client/ IS NOT HERE, deliberately, and pyproject.toml says the same in more words: the
# console is vanilla JS and flake8 never opens a .js file, but client/tests/ is real
# python, and excluding the directory would leave the console's whole test harness
# unlinted while the report claimed a clean tree.
extend-exclude =
    .venv,
    .git,
    .mypy_cache,
    __pycache__,
    data

# Print flake8's own total as the last line of its output. `python lint.py` counts the
# finding lines itself and prints that number in its report, so this is the cross-check:
# two numbers from two places, visible together, and a silent disagreement between them
# is impossible to miss.
count = True

# A finding that is genuinely intended is marked at the line with a noqa naming the CODE
# it silences. A bare one silences whatever else lands on that line later, including the
# finding nobody has made yet, which is the linting equivalent of a readout that latched
# on the last good value. flake8 cannot enforce that its own suppressions are labelled,
# so the entry point does: `python lint.py` runs a SUPPRESSIONS pass over every comment
# in this project's python. It needs no package installed, so it can never come back
# "absent" — and it holds mypy ignores to the higher bar this repo set for them, a code
# AND a written reason, which is a rule with no exceptions in the tree to grandfather.

