# nginx — single topside origin (spec §7). Serves the SPA and reverse-proxies
# BOTH planes so there is no CORS and the browser never touches 192.72.1.1.
#
#   /                -> the dashboard SPA (static client)
#   /api, /ws        -> the control plane (FastAPI on :8000)
#   /stream, /go2rtc -> the video plane (go2rtc on :1984), WebRTC/WHEP
#
# Install: cp to /etc/nginx/sites-available/neptune, symlink into sites-enabled,
#          set the client root, `nginx -t && systemctl reload nginx`.

upstream neptune_api  { server 127.0.0.1:8000; }
upstream go2rtc       { server 127.0.0.1:1984; }

server {
    listen 80 default_server;
    server_name _;

    # ---- SPA ----
    root /opt/neptune/client;          # <-- the client/ folder from this repo
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- control plane: REST ----
    location /api/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;       # download offload can be long
        proxy_buffering off;           # never cache camera status (§3.3d)
        add_header Cache-Control "no-store" always;
    }

    # ---- control plane: telemetry + ROV control WebSockets ----
    location /ws/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- video plane: go2rtc API + WebRTC/WHEP signaling ----
    location /go2rtc/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    # go2rtc's stream/WebRTC endpoints (the SPA points its player here)
    location /stream/ {
        proxy_pass http://go2rtc/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
