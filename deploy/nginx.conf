# nginx — the Pi is BACKEND-ONLY, on a private point-to-point tether between two
# trusted devices with no route to the outside world. So it's PLAIN HTTP — no TLS,
# no cert, nothing to trust, less CPU. It just reverse-proxies the API + video planes
# so the handheld never touches the camera (192.72.1.1) directly.
#
#   /                -> a plain-text "backend OK" status line
#   /api, /ws        -> the control plane (FastAPI on :8000)
#   /stream, /go2rtc -> the video plane (go2rtc on :1984), WebRTC/WHEP
#
# (WebRTC media is still DTLS-SRTP encrypted regardless — only the signaling is plain.)
#
# Install: cp to /etc/nginx/sites-available/neptune, symlink into sites-enabled,
#          `nginx -t && systemctl reload nginx`.

upstream neptune_api  { server 127.0.0.1:8000; }
upstream go2rtc       { server 127.0.0.1:1984; }

server {
    listen 80 default_server;
    server_name _;

    # ---- backend only: no dashboard here (it runs topside on the Ally) ----
    location = / {
        add_header Content-Type text/plain always;
        return 200 "NEPTUNE backend OK — the dashboard runs topside on the ROG Ally.\n";
    }

    # ---- control plane: REST (includes offline-area tile serving /api/areas/.../tiles) ----
    location /api/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;        # area downloads can be long
        proxy_buffering off;            # never cache camera status (§3.3d)
        add_header Cache-Control "no-store" always;
    }

    # ---- control plane: telemetry + ROV control + nav WebSockets ----
    location /ws/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- video plane: go2rtc API + WebRTC/WHEP signaling ----
    location /go2rtc/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /stream/ {
        proxy_pass http://go2rtc/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
