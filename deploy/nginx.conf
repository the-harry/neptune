# nginx — single topside origin (spec §1/§7). Serves the SPA over HTTPS and
# reverse-proxies BOTH planes so there is no CORS and the browser never touches
# 192.72.1.1 directly.
#
#   /                -> the dashboard SPA (static client)
#   /api, /ws        -> the control plane (FastAPI on :8000)
#   /stream, /go2rtc -> the video plane (go2rtc on :1984), WebRTC/WHEP
#
# HTTPS is REQUIRED (§1): geolocation (the origin fix) only works in a secure
# context, and a remote Pi is not localhost. A self-signed cert, trusted once on
# the handheld, satisfies that. install.sh generates it at /etc/neptune/tls/.
#
# Install: cp to /etc/nginx/sites-available/neptune, symlink into sites-enabled,
#          set the client root, `nginx -t && systemctl reload nginx`.

upstream neptune_api  { server 127.0.0.1:8000; }
upstream go2rtc       { server 127.0.0.1:1984; }

# ---- HTTP :80 → redirect everything to HTTPS (§1: never serve the app insecurely) ----
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS :443 — the one real origin ----
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/neptune/tls/neptune.crt;   # self-signed, generated by install.sh
    ssl_certificate_key /etc/neptune/tls/neptune.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- SPA ----
    root /opt/neptune/client;          # <-- the client/ folder from this repo
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- control plane: REST (includes offline-area tile serving /api/areas/.../tiles) ----
    location /api/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;        # area downloads can be long
        proxy_buffering off;            # never cache camera status (§3.3d)
        add_header Cache-Control "no-store" always;
    }

    # ---- control plane: telemetry + ROV control + nav WebSockets ----
    location /ws/ {
        proxy_pass http://neptune_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- video plane: go2rtc API + WebRTC/WHEP signaling ----
    location /go2rtc/ {
        proxy_pass http://go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /stream/ {
        proxy_pass http://go2rtc/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
