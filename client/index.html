<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>NEPTUNE COMMAND</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface-dim text-on-surface font-body-standard overflow-hidden select-none">

<!-- CAMERA FEED BACKGROUND -->
<div class="fixed inset-0 z-0">
  <div id="video-backdrop"></div>
  <!-- WebRTC feed from go2rtc (WOLFANG camera). srcObject set by video.js. -->
  <video id="video-feed" class="w-full h-full object-cover opacity-90" muted playsinline autoplay style="position:absolute;inset:0;z-index:1;visibility:hidden"></video>
  <!-- NO FEED / RECONFIGURING overlay -->
  <div id="no-feed" class="hidden">
    <div class="nf-badge" id="no-feed-badge">NO&nbsp;FEED</div>
    <div class="nf-sub" id="no-feed-sub">awaiting camera</div>
  </div>
  <div class="absolute inset-0 bg-gradient-to-t from-surface-dim/40 to-transparent" style="z-index:3"></div>
  <div class="scanning-line" style="z-index:3"></div>
</div>

<!-- TOP APP BAR -->
<header class="fixed top-0 left-0 w-full h-16 flex justify-between items-center px-edge-margin z-50 bg-surface/30 backdrop-blur-lg border-b border-white/10">
<div id="armed-pill" class="flex items-center gap-2 bg-tertiary/20 px-3 py-1 rounded-full border border-tertiary/50">
<span id="armed-dot" class="w-2 h-2 bg-tertiary rounded-full animate-pulse glow-shadow-sm"></span>
<span id="armed-label" class="font-label-caps text-label-caps text-tertiary">ARMED</span>
</div>
<div id="leak-chip" class="flex items-center gap-2 opacity-50">
<span class="material-symbols-outlined text-on-surface text-sm"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3s6 6.5 6 10a6 6 0 0 1-12 0c0-3.5 6-10 6-10z"/></svg></span>
<span id="leak-text" class="font-label-caps text-label-caps uppercase">Leak Normal</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 13a8 8 0 0 1 16 0"/><path fill="currentColor" d="M12 13l4-2.5-5 1.2z"/><circle cx="12" cy="13" r="1.4" fill="currentColor"/></svg></span>
<div class="flex flex-col" style="line-height:1.05">
<span class="font-label-caps text-[10px] text-on-surface-variant">PRESSURE</span>
<span id="pressure-val" class="font-telemetry-sm text-telemetry-sm text-primary glow-cyan">14.7 PSI</span>
</div>
</div>
<div class="flex items-center gap-2"><span class="font-label-caps text-[10px] text-on-surface-variant">BALLAST</span><span id="ballast-pct" class="font-telemetry-sm text-telemetry-sm text-primary">40%</span></div>
<div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-sm"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm2.5-10.5L9 11l1.5 3.5L16 13l-1.5-3.5z"/></svg></span><span id="heading-val" class="font-telemetry-sm text-telemetry-sm text-primary">284&deg; NW</span></div>
<div id="chip-magnet" class="flex items-center gap-2"><span class="hud-dot"></span><span id="chip-magnet-text" class="font-label-caps text-[10px] text-on-surface-variant">MAGNET: OFF</span></div>
<div class="flex items-center gap-2"><span class="font-label-caps text-[10px] text-on-surface-variant">CPU</span><span id="cpu-c" class="font-telemetry-sm text-telemetry-sm text-primary">42&deg;C</span></div>
<div class="flex items-center gap-2"><span class="font-label-caps text-[10px] text-on-surface-variant">RAM</span><span id="ram-pct" class="font-telemetry-sm text-telemetry-sm text-primary">34%</span></div>
<div class="flex items-center gap-2"><span class="font-label-caps text-[10px] text-on-surface-variant">DISK</span><span id="disk-gb" class="font-telemetry-sm text-telemetry-sm text-primary">12.4 GB</span></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.34C7 21.4 7.6 22 8.33 22h7.34c.73 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></span>
<span id="battery-v" class="font-telemetry-sm text-telemetry-sm text-primary">24.8V</span>
</div>
<div class="flex items-center gap-2">
<span id="link-icon" class="material-symbols-outlined text-primary"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h3v-6H5v6zm6 0h3V9h-3v11zm6 0h3V4h-3v16z"/></svg></span>
<span id="link-ms" class="font-telemetry-sm text-telemetry-sm text-primary">-- ms</span>
</div>
<!-- VIDEO status sits beside the latency marker -->
<div id="chip-video" class="flex items-center gap-2"><span class="hud-dot"></span><span id="chip-video-text" class="font-telemetry-sm text-telemetry-sm text-primary">VIDEO</span></div>
<span class="text-on-surface-variant" style="opacity:.25">|</span>
<!-- CAMERA cluster: record state / battery / SD -->
<div class="flex items-center gap-2"><span id="cam-rec-dot" class="hud-dot"></span><span id="cam-rec-label" class="font-label-caps text-label-caps">IDLE</span></div>
<div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary text-sm"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.34C7 21.4 7.6 22 8.33 22h7.34c.73 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></span><span id="cam-battery" class="font-telemetry-sm text-telemetry-sm text-primary">--</span></div>
<span id="cam-sd" class="font-telemetry-sm text-telemetry-sm text-on-surface-variant">SD:--</span>
</header>
<!-- Camera fault channel (WarningMSG / degraded) — hidden unless there's a fault -->
<div id="cam-warning" class="fixed left-1/2 -translate-x-1/2 z-50" style="top:64px"></div>

<!-- RIGHT CONTROL RAIL -->
<aside class="fixed right-0 top-0 h-full w-[110px] z-50 glass-panel flex flex-col pt-20 pb-safe-area-bottom px-4 gap-3 overflow-hidden no-scrollbar border-l border-white/20 glow-shadow-rail">
<!-- SURFACE emergency — HOLD to activate (deliberate, not a stray tap) -->
<section class="flex flex-col gap-2">
<button id="btn-surface" class="relative overflow-hidden w-full py-3 rounded border-2 border-secondary bg-secondary/10 text-secondary flex flex-col items-center gap-1 active:scale-95 transition-all" title="HOLD to surface (emergency)" style="touch-action:none">
<span id="surface-fill" class="absolute inset-y-0 left-0 bg-secondary/40" style="width:0%"></span>
<span class="material-symbols-outlined" style="position:relative"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 20V5M6 11l6-6 6 6"/></svg></span>
<span class="font-label-caps text-[10px]" style="position:relative">SURFACE</span>
<span id="surface-hint" class="font-label-caps text-[10px] text-secondary/70" style="position:relative">HOLD</span>
</button>
</section>
<!-- LIGHTS -->
<section class="flex flex-col gap-3">
<span class="font-label-caps text-label-caps text-on-surface-variant text-center">LIGHTS</span>
<div class="flex flex-col items-center gap-2">
<!-- Green Light -->
<div class="flex flex-col items-center gap-1">
<button id="btn-light-green" class="w-12 h-12 rounded-full flex items-center justify-center bg-tertiary/30 border-2 border-tertiary glow-shadow-md active:scale-95 transition-all" title="Toggle green LED">
<span id="icon-light-green" class="material-symbols-outlined text-tertiary"></span>
</button>
<button id="led-green-up" class="material-symbols-outlined text-tertiary text-sm active:bg-tertiary/20 p-1 rounded" title="Brighter (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg></button>
<div id="track-green" class="h-16 w-4 bg-surface-variant rounded-full relative overflow-hidden border border-white/10" title="Drag to set brightness" style="cursor:ns-resize;touch-action:none">
<div id="gauge-green" class="absolute bottom-0 w-full bg-tertiary glow-shadow-sm" style="height:80%"></div>
</div>
<button id="led-green-down" class="material-symbols-outlined text-tertiary text-sm active:bg-tertiary/20 p-1 rounded" title="Dimmer (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg></button>
</div>
<!-- White Light -->
<div class="flex flex-col items-center gap-1">
<button id="btn-light-white" class="w-12 h-12 rounded-full flex items-center justify-center bg-surface-variant border-2 border-outline-variant active:scale-95 transition-all" title="Toggle white LED">
<span id="icon-light-white" class="material-symbols-outlined text-on-surface-variant"></span>
</button>
<button id="led-white-up" class="material-symbols-outlined text-on-surface-variant text-sm active:bg-surface-variant p-1 rounded" title="Brighter (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg></button>
<div id="track-white" class="h-16 w-4 bg-surface-variant rounded-full relative overflow-hidden border border-white/10" title="Drag to set brightness" style="cursor:ns-resize;touch-action:none">
<div id="gauge-white" class="absolute bottom-0 w-full bg-on-surface-variant/40" style="height:20%"></div>
</div>
<button id="led-white-down" class="material-symbols-outlined text-on-surface-variant text-sm active:bg-surface-variant p-1 rounded" title="Dimmer (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg></button>
</div>
</div>
</section>
<!-- BALLAST -->
<section class="flex flex-col gap-3">
<span class="font-label-caps text-label-caps text-on-surface-variant text-center">BALLAST</span>
<div class="flex flex-col items-center gap-2">
<button id="btn-ballast-fill" class="material-symbols-outlined text-primary active:bg-primary/20 p-1 rounded" title="More ballast / dive (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/></svg></button>
<div id="ballast-track" class="h-32 w-6 bg-surface-variant rounded border border-white/10 relative" title="Drag to set ballast target" style="cursor:ns-resize;touch-action:none">
<div id="ballast-fill" class="absolute bottom-0 left-0 right-0 bg-primary/60 border-t-2 border-primary glow-cyan" style="height:40%"></div>
<div id="ballast-target-mark" class="absolute left-0 right-0" style="bottom:40%;height:2px;background:var(--secondary);box-shadow:0 0 6px var(--secondary)"></div>
</div>
<button id="btn-ballast-empty" class="material-symbols-outlined text-primary active:bg-primary/20 p-1 rounded" title="Less ballast / surface (click or hold)"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg></button>
</div>
</section>
<!-- CONFIG -->
<section class="flex flex-col gap-3 mt-2">
<span class="font-label-caps text-label-caps text-on-surface-variant text-center">CONFIG</span>
<div class="flex flex-col gap-3">
<button id="btn-config" class="w-full py-3 rounded border border-outline-variant text-on-surface-variant flex flex-col items-center gap-1 active:bg-surface-variant transition-colors" title="Open config &amp; input mapping">
<span class="material-symbols-outlined"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.4 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L1.77 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.24 1.13-.56 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></span>
<span class="font-label-caps text-[10px]">OPEN</span>
</button>
</div>
</section>
</aside>

<!-- BOTTOM LEFT — minimal L/R thruster indicators only (keeps the feed clear) -->
<div class="fixed bottom-edge-margin left-edge-margin z-40 flex flex-col gap-2">
<div class="flex items-center gap-2">
<span class="font-label-caps text-[10px] text-on-surface-variant" style="width:14px">L</span>
<div class="h-1.5 bg-surface-variant/40 rounded-full relative overflow-hidden" style="width:120px">
<div class="absolute inset-y-0 left-1/2" style="width:1px;background:rgba(255,255,255,.25)"></div>
<div id="thrust-left" class="absolute inset-y-0 left-1/2 bg-primary" style="width:0%"></div>
</div>
</div>
<div class="flex items-center gap-2">
<span class="font-label-caps text-[10px] text-on-surface-variant" style="width:14px">R</span>
<div class="h-1.5 bg-surface-variant/40 rounded-full relative overflow-hidden" style="width:120px">
<div class="absolute inset-y-0 left-1/2" style="width:1px;background:rgba(255,255,255,.25)"></div>
<div id="thrust-right" class="absolute inset-y-0 left-1/2 bg-primary" style="width:0%"></div>
</div>
</div>
</div>

<!-- BOTTOM RIGHT — camera shutter controls (in-dive allowed: record + capture) -->
<div class="fixed bottom-edge-margin z-40 flex items-center gap-panel-gap" style="right:134px">
<button id="cam-rec" class="w-20 h-20 rounded-full border-2 border-error bg-error/10 text-error flex flex-col items-center justify-center gap-1 active:scale-90 transition-transform" title="Record toggle (polled confirmation)">
<span class="material-symbols-outlined text-2xl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg></span>
<span class="cam-rec-txt font-label-caps text-label-caps text-[10px]">REC</span>
</button>
<button id="cam-capture" class="w-16 h-16 rounded-full border-2 border-primary bg-primary/10 text-primary flex flex-col items-center justify-center gap-1 active:scale-90 transition-transform" title="Capture still">
<span class="material-symbols-outlined text-xl"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
<span class="font-label-caps text-label-caps text-[10px]">STILL</span>
</button>
</div>
<!-- Camera action toast -->
<div id="cam-toast" class="cam-toast"></div>

<!-- Full-screen overlays -->
<div id="leak-pulse"></div>
<div id="screen-flash"></div>

<!-- ============================================================================
     SCRIPTS — classic (non-module) scripts sharing global scope, loaded in
     dependency order. Classic (not ES modules) so the SAME files run from
     file:// AND when served by FastAPI. config.js MUST load first; main.js last.
     ============================================================================ -->
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/video.js"></script>
<script src="js/net.js"></script>
<script src="js/commands.js"></script>
<script src="js/input.js"></script>
<script src="js/controls.js"></script>
<script src="js/render.js"></script>
<script src="js/camera.js"></script>
<script src="js/main.js"></script>
</body></html>
